<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator – Functions Assignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
    <div style="background:#1e293b; padding:12px 24px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; gap:16px; align-items:center; font-family:'Inter',sans-serif;">
        <a href="dashboard.html" style="color:#94a3b8; text-decoration:none; font-weight:500; font-size:0.88rem;">&larr; Dashboard</a>
        <a href="notes.html" style="color:#a78bfa; text-decoration:none; font-weight:600; font-size:0.88rem; margin-left:auto;">Notes Studio &rarr;</a>
    </div>

    <div class="page-wrapper">
        <div class="calculator">
            <p class="calc-title">Calculator</p>

            <div class="calc-display">
                <div id="expression"></div>
                <div id="result">0</div>
            </div>

            <div class="calc-buttons">
                <button class="btn btn-clear" onclick="clearAll()">AC</button>
                <button class="btn btn-clear" onclick="backspace()">&#9003;</button>
                <button class="btn btn-fn" onclick="appendToExpr('%')">%</button>
                <button class="btn btn-op" onclick="appendToExpr('&#247;')">&#247;</button>

                <button class="btn btn-num" onclick="appendToExpr('7')">7</button>
                <button class="btn btn-num" onclick="appendToExpr('8')">8</button>
                <button class="btn btn-num" onclick="appendToExpr('9')">9</button>
                <button class="btn btn-op" onclick="appendToExpr('&#215;')">&#215;</button>

                <button class="btn btn-num" onclick="appendToExpr('4')">4</button>
                <button class="btn btn-num" onclick="appendToExpr('5')">5</button>
                <button class="btn btn-num" onclick="appendToExpr('6')">6</button>
                <button class="btn btn-op" onclick="appendToExpr('-')">&#8722;</button>

                <button class="btn btn-num" onclick="appendToExpr('1')">1</button>
                <button class="btn btn-num" onclick="appendToExpr('2')">2</button>
                <button class="btn btn-num" onclick="appendToExpr('3')">3</button>
                <button class="btn btn-op" onclick="appendToExpr('+')">+</button>

                <button class="btn btn-num" onclick="appendToExpr('0')">0</button>
                <button class="btn btn-num" onclick="appendDecimal()">.</button>
                <button class="btn btn-fn" onclick="appendToExpr('^')">x&#696;</button>
                <button class="btn btn-eq" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script src="js/calculator.js"></script>
</body>
</html>
